name: k6 TypeScript CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

defaults:
  run:
    working-directory: typescript

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/package.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.50.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run API smoke test
        run: npm run test:api:smoke

      - name: Run UI smoke test
        run: npm run test:ui:smoke

  build-and-test-yarn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: |
            typescript/yarn.lock
            typescript/package.json

      - name: Enable Yarn (classic)
        run: npm install -g yarn

      - name: Install dependencies (yarn)
        run: yarn install

      - name: Type check (yarn)
        run: yarn type-check

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.50.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run API smoke test (yarn)
        run: yarn test:api:smoke

      - name: Run UI smoke test (yarn)
        run: yarn test:ui:smoke


